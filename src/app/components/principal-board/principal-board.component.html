<div class="principal-container">
  <div class="main-card">
    
    <div class="content-grid">
      
      <!-- GIF + Botón -->
      <div class="gif-column">
        <div class="gif-wrapper">
          <img
            src="https://media.tenor.com/3nCpSb6IvrQAAAAi/bomb-light.gif"
            alt="Bomba explotando"
            class="bomb-gif"
          />
          <div class="gif-label">{{labels.respondFast}}</div>
          <button 
            pButton 
            [label]="labels.startGame"
            icon="fas fa-play"
            class="start-button"
            (click)="onStartGame()">
          </button>
        </div>
      </div>

      <!-- Instrucciones -->
      <div class="instructions-column">
        <div class="instructions-card">
          <h3 class="instructions-title">
            <i class="fas fa-graduation-cap"></i>
            {{labels.howToPlay}}
          </h3>
          
          <div class="steps-container">
            <div class="step">
              <div class="step-number">1</div>
              <div class="step-content">
                <strong>{{labels.step1Title}}</strong>
                <p>{{labels.step1Desc}}</p>
              </div>
            </div>

            <div class="step">
              <div class="step-number">2</div>
              <div class="step-content">
                <strong>{{labels.step2Title}}</strong>
                <p>{{labels.step2Desc}}</p>
              </div>
            </div>

            <div class="step">
              <div class="step-number">💥</div>
              <div class="step-content">
                <strong>{{labels.step3Title}}</strong>
                <p>{{labels.step3Desc}}</p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>
